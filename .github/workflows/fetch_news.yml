name: Auto News Generator

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bağımlılıkları Yükle
        run: |
          pip install feedparser markdown

      - name: Botu Çalıştır
        run: python script.py

      - name: Değişiklikleri Commit & Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/ site/ index.html news_list.json .nojekyll
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: yeni haber eklendi" && git push)

      - name: Pages Artifact Hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pages'a Deploy Et
        uses: actions/deploy-pages@v4
        
